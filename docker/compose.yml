# Local Redis for PassControl, exposed over the Upstash REST API via
# serverless-redis-http (SRH) — because lib/state/redis.ts uses the @upstash/redis
# REST client (Redis.fromEnv()), which cannot talk to a plain TCP Redis.
#
# Point the app at it with:
#   UPSTASH_REDIS_REST_URL=http://localhost:8079
#   UPSTASH_REDIS_REST_TOKEN=passcontrol_local_dev_token
#
# Bring up:   docker compose -f docker/compose.yml up -d
# Spike:      node scripts/srh-spike.mjs
# Tear down:  docker compose -f docker/compose.yml down -v
#
# NOTE: Supabase (Postgres + Vault + Auth) is NOT here — it's run via the Supabase
# CLI (`supabase start`), the official Docker stack CI already uses. This file only
# supplies the Redis-over-REST piece the CLI doesn't give you.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  srh:
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    depends_on:
      - redis
    environment:
      SRH_MODE: env
      SRH_TOKEN: passcontrol_local_dev_token
      SRH_CONNECTION_STRING: "redis://redis:6379"
    ports:
      # LOOPBACK ONLY, deliberately. SRH authenticates with the fixed dev token
      # three lines up, which is committed to this repository — so this bridge
      # is safe exactly as long as nothing off this machine can reach it. Docker
      # publishes on every interface when no host address is given, and writes
      # its own iptables rules on Linux, so "I have a firewall" does not cover
      # it: `up -d` on a laptop joined to any shared network was handing every
      # host on that network an authenticated Redis holding the kill switch,
      # every nonce and every budget counter. The host address goes in front of
      # the port variable, which callers always set to a bare integer
      # (scripts/dev-stack.sh, and the CLI's `setup --port-offset`).
      - "127.0.0.1:${PASSCONTROL_SRH_PORT:-8079}:80"
    restart: unless-stopped
