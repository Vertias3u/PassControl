# gitleaks config for PassControl.
# Extends the default ruleset, but does not flag the committed env TEMPLATES
# (.env.example, .env.docker.example) — they contain only placeholder values by
# design. Real secrets live in .env.local / .env.docker, which are gitignored and
# never committed. This keeps `gitleaks detect` a true pass/fail gate for a
# security-focused repo (contributors + CI won't hit a false positive on the sample).
title = "PassControl gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Placeholders and test fixtures, not real secrets"
paths = [
  '''\.env\.example$''',
  '''\.env\.docker\.example$''',
  # Test files carry dummy secret-shaped fixtures by design (e.g. a 32-byte
  # "previous-secret-…" for the VISA_SECRET length check, "sk-not-ours-…" fake
  # keys). Real secrets never live in tests — they're in gitignored .env files —
  # and scripts/curate-public.sh runs its own independent secret grep over the
  # whole tree as a second layer, so allowlisting fixtures keeps gitleaks a clean
  # pass/fail gate without disabling real detection on shippable code.
  # `tsx?` covers the component-rendering tests, which are newer than this rule:
  # a `.test.tsx` fixture such as an avatar capability key is the same kind of
  # made-up literal, but `.test.ts$` did not match it and the gate went red on a
  # string that never existed anywhere but that assertion.
  '''tests/.*\.test\.tsx?$''',
]
regexes = [
  # The seeded keyless-demo passport, committed ON PURPOSE and documented at
  # bin/passcontrol.mjs:55-60 and lib/demo/identity.ts:5-6. It can only ever
  # reach the env-gated `demo` provider, which synthesizes its response and
  # never touches the Vault — it grants nothing in a real deployment. The
  # values are duplicated across the app and the plain-ESM CLI by design, so
  # one value-scoped entry covers both call sites.
  #
  # Matched by VALUE, deliberately not by path: allowlisting
  # `bin/passcontrol.mjs` would disable secret detection across the CLI's whole
  # 1600-line entry point, and this file is a real security gate. Every other
  # line of both files stays under detection.
  '''XqsVuXtmWiu6bKEmmqov2Q2TwkOVdzlZMWR-NWubSKo''',   # demo passport secret
  '''kZCFp7d2x4VDruiulJ21gogYbczBDAGZa-OuwR3qgh8''',   # demo passport id
  '''pc_demolocaltrydemolocaltrydemolocaltry0000''',   # demo control-plane key
]
